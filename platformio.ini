; PlatformIO Project Configuration File for Waveshare ESP32-S3 PoE Relay / IO Controller
; Target: ESP32-S3 (8MB Flash, Quad SPI / Octal PSRAM)

[platformio]
default_envs = waveshare_esp32s3_poe
src_dir = src
include_dir = include

[env:waveshare_esp32s3_poe]
platform = espressif32 @ ^6.5.0
board = esp32-s3-devkitc-1
framework = arduino

; Serial & Upload Config
monitor_speed = 115200
upload_speed = 921600

; Memory & Flash (8MB Flash)
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.flash_mode = qio
board_build.flash_size = 8MB
board_build.partitions = default_8MB.csv

; Compiler Flags & Definitions
build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D ARDUINO_USB_MODE=1
    -D ARDUINO_USB_CDC_ON_BOOT=1
    -D WAVESHARE_ESP32S3_POE_8CH=1

; Dependencies
lib_deps = 
    bblanchon/ArduinoJson @ ^7.0.4
    knolleary/PubSubClient @ ^2.8
    emelianov/modbus-esp8266 @ ^4.1.0
    links2004/WebSockets @ ^2.4.1
