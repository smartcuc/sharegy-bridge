name: Build & Release Firmware

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build PlatformIO Firmware
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PlatformIO Core
        run: |
          python -m pip install --upgrade pip
          pip install --upgrade platformio

      - name: Build Firmware (waveshare_esp32s3_poe)
        run: |
          pio run -e waveshare_esp32s3_poe

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: waveshare-esp32s3-firmware
          path: |
            .pio/build/waveshare_esp32s3_poe/firmware.bin
            .pio/build/waveshare_esp32s3_poe/partitions.bin
            .pio/build/waveshare_esp32s3_poe/bootloader.bin

      - name: Create Release for Tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            .pio/build/waveshare_esp32s3_poe/firmware.bin
            .pio/build/waveshare_esp32s3_poe/partitions.bin
            .pio/build/waveshare_esp32s3_poe/bootloader.bin
          draft: false
          prerelease: false
          generate_release_notes: true
